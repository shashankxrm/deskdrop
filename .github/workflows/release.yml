name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: assembleDebug
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew assembleDebug --no-daemon
      - name: rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "dist/deskdrop-android-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/deskdrop-android-${{ github.ref_name }}.apk
          if-no-files-found: error

  macos:
    name: macos
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build darwin arm64 and amd64
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p dist
          GOOS=darwin GOARCH=arm64 go build -o dist/deskdrop-agent-darwin-arm64 ./cmd/agent
          GOOS=darwin GOARCH=amd64 go build -o dist/deskdrop-agent-darwin-amd64 ./cmd/agent
      - uses: actions/upload-artifact@v4
        with:
          name: macos-agent
          path: |
            dist/deskdrop-agent-darwin-arm64
            dist/deskdrop-agent-darwin-amd64
          if-no-files-found: error

  github-release:
    name: github-release
    needs: [android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum \
            "deskdrop-android-${GITHUB_REF_NAME}.apk" \
            deskdrop-agent-darwin-arm64 \
            deskdrop-agent-darwin-amd64 \
            | tee SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/deskdrop-android-${{ github.ref_name }}.apk
            dist/deskdrop-agent-darwin-arm64
            dist/deskdrop-agent-darwin-amd64
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          body: |
            Unsigned Mac agent: System Settings → Privacy & Security → Open Anyway
            (or `xattr -d com.apple.quarantine`). Android APK is debug.
