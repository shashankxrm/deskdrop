name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  agent:
    name: agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: compile
        run: go build -o /tmp/deskdrop-agent ./cmd/agent

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: compose up
        run: docker compose up --build -d
      - name: compose API + agent E2E
        run: tests/e2e/compose_api.sh
      - name: Playwright
        working-directory: dashboard
        env:
          CI: true
          API_BASE: http://127.0.0.1:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: compose logs on failure
        if: failure()
        run: docker compose logs --tail 200

  deploy:
    name: deploy
    needs: [go-test, dashboard, android, agent, e2e]
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/v2' &&
      github.repository == 'shashankxrm/deskdrop' &&
      secrets.DEPLOY_SSH_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: deploy-v2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}
      - name: rsync and compose up
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.cursor' \
            --exclude 'dashboard/node_modules' \
            --exclude 'dashboard/.next' \
            --exclude 'android' \
            --exclude 'deploy/prod/.env' \
            --exclude '.env' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:~/deskdrop/"
          ssh -o IdentitiesOnly=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd ~/deskdrop && docker compose -f deploy/prod/compose.yaml --env-file deploy/prod/.env up --build -d'
          curl -fsS --retry 8 --retry-delay 5 "https://shashank-dropdesk.duckdns.org/healthz"
