name: ci

on:
  push:
    branches: [v2]
  pull_request:
    branches: [v2]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: go-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  android:
    name: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: unit tests
        working-directory: android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  agent:
    name: agent
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: compile
        run: go build -o /tmp/deskdrop-agent ./cmd/agent

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - name: compose up
        run: docker compose up --build -d
      - name: compose API + agent E2E
        run: tests/e2e/compose_api.sh
      - name: reset in-memory pairing limiter
        run: |
          docker compose restart api
          for i in $(seq 1 60); do
            curl -sfS http://127.0.0.1:8080/readyz && exit 0
            sleep 1
          done
          echo "api not ready after restart" >&2
          exit 1
      - name: Playwright
        working-directory: dashboard
        env:
          CI: true
          API_BASE: http://127.0.0.1:8080
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: compose logs on failure
        if: failure()
        run: docker compose logs --tail 200

  images:
    name: images
    needs: [go-test, dashboard, android, agent, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    env:
      API_IMAGE: ghcr.io/${{ github.repository }}/api
      DASH_IMAGE: ghcr.io/${{ github.repository }}/dashboard
    steps:
      - uses: actions/checkout@v4
      - name: build
        run: |
          docker build -f deploy/compose/Dockerfile.api -t "$API_IMAGE:${GITHUB_SHA}" -t deskdrop-api:ci .
          docker build -f deploy/compose/Dockerfile.dashboard -t "$DASH_IMAGE:${GITHUB_SHA}" -t deskdrop-dashboard:ci .
      - name: non-root and no secrets in image
        run: ./scripts/check-images.sh deskdrop-api:ci deskdrop-dashboard:ci
      - name: push to GHCR
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" != push ] || [ "${GITHUB_REF}" != refs/heads/v2 ]; then
            echo "Skipping GHCR push (PR or non-v2)."
            exit 0
          fi
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "deskdrop-api:ci" "$API_IMAGE:v2"
          docker tag "deskdrop-dashboard:ci" "$DASH_IMAGE:v2"
          docker push "$API_IMAGE:${GITHUB_SHA}"
          docker push "$API_IMAGE:v2"
          docker push "$DASH_IMAGE:${GITHUB_SHA}"
          docker push "$DASH_IMAGE:v2"

  deploy:
    name: deploy
    needs: [go-test, dashboard, android, agent, e2e, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/v2' && github.repository == 'shashankxrm/deskdrop'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: rsync and compose up
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY}" ] || [ -z "${DEPLOY_HOST}" ] || [ -z "${DEPLOY_USER}" ]; then
            echo "Skipping deploy; set DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER."
            exit 0
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          rsync -az --delete -e 'ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes' \
            --exclude '.git' \
            --exclude '.cursor' \
            --exclude 'dashboard/node_modules' \
            --exclude 'dashboard/.next' \
            --exclude 'android' \
            --exclude 'deploy/prod/.env' \
            --exclude '.env' \
            ./ "${DEPLOY_USER}@${DEPLOY_HOST}:~/deskdrop/"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd ~/deskdrop && docker compose -f deploy/prod/compose.yaml --env-file deploy/prod/.env up --build -d'
          curl -fsS --retry 8 --retry-delay 5 "https://shashank-dropdesk.duckdns.org/healthz"
