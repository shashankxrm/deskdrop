# Local dev. From repo root: docker compose up --build
# Postgres password here is local-only; it is not an API default secret.

name: deskdrop

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deskdrop
      POSTGRES_PASSWORD: deskdrop
      POSTGRES_DB: deskdrop
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskdrop -d deskdrop"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../migrations:/migrations:ro
    entrypoint:
      [
        "migrate",
        "-path",
        "/migrations",
        "-database",
        "postgres://deskdrop:deskdrop@postgres:5432/deskdrop?sslmode=disable",
      ]
    command: ["up"]

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://deskdrop:deskdrop@postgres:5432/deskdrop?sslmode=disable
      # Local compose only. Not a code default; the process still exits if this is unset.
      DEVICE_TOKEN_PEPPER: compose-local-pepper
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  pgdata:
