apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: deskdrop
resources:
  - postgres.yaml
  - migrate.yaml
  - api.yaml
  - dashboard.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: migrations
    files:
      - migrations/000001_init.up.sql
      - migrations/000001_init.down.sql
generatorOptions:
  disableNameSuffixHash: true
images:
  - name: ghcr.io/shashankxrm/deskdrop/api
    newTag: v2
  - name: ghcr.io/shashankxrm/deskdrop/dashboard
    newTag: v2
