apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: deskdrop
  labels:
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: deskdrop
  labels:
    app: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
      containers:
        - name: api
          image: ghcr.io/shashankxrm/deskdrop/api:v2
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: HTTP_ADDR
              value: ":8080"
            - name: CORS_ORIGINS
              value: ""
            - name: COOKIE_SECURE
              value: "true"
            - name: TRUST_PROXY
              value: "true"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: deskdrop
                  key: DATABASE_URL
            - name: DEVICE_TOKEN_PEPPER
              valueFrom:
                secretKeyRef:
                  name: deskdrop
                  key: DEVICE_TOKEN_PEPPER
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 400m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
