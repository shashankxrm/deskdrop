# Public stack on the A0 Oracle VM. From repo root:
#   docker compose -f deploy/prod/compose.yaml --env-file deploy/prod/.env up --build -d
# Postgres is not published. TLS is Caddy + Let's Encrypt (HTTP-01).

name: deskdrop-prod

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: deskdrop
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: deskdrop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deskdrop -d deskdrop"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../migrations:/migrations:ro
    entrypoint:
      [
        "migrate",
        "-path",
        "/migrations",
        "-database",
        "postgres://deskdrop:${POSTGRES_PASSWORD}@postgres:5432/deskdrop?sslmode=disable",
      ]
    command: ["up"]

  api:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.api
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://deskdrop:${POSTGRES_PASSWORD}@postgres:5432/deskdrop?sslmode=disable
      DEVICE_TOKEN_PEPPER: ${DEVICE_TOKEN_PEPPER}
      CORS_ORIGINS: ""
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8080/healthz >/dev/null",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/compose/Dockerfile.dashboard
    expose:
      - "3000"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.11.3
    profiles: ["metrics"]
    command: ["run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      GRAFANA_CLOUD_RW_URL: ${GRAFANA_CLOUD_RW_URL}
      GRAFANA_CLOUD_USER: ${GRAFANA_CLOUD_USER}
      GRAFANA_CLOUD_TOKEN: ${GRAFANA_CLOUD_TOKEN}
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DESKDROP_HOST: ${DESKDROP_HOST}
      CADDY_EMAIL: ${CADDY_EMAIL}
      METRICS_USER: ${METRICS_USER}
      METRICS_HASH: ${METRICS_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
